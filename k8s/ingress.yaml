# Optional: requires an ingress controller (minikube: `minikube addons enable ingress`).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-risk-api
  namespace: heart-risk
spec:
  ingressClassName: nginx
  rules:
    - host: heart-risk.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-risk-api
                port:
                  name: http
