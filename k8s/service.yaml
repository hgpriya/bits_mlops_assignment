apiVersion: v1
kind: Service
metadata:
  name: heart-risk-api
  namespace: heart-risk
  labels:
    app: heart-risk-api
spec:
  # On minikube, run `minikube tunnel` to get an EXTERNAL-IP for this service.
  type: LoadBalancer
  selector:
    app: heart-risk-api
  ports:
    - name: http
      port: 80
      targetPort: http
