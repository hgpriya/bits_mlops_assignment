# API + Prometheus + Grafana monitoring stack.
# Start (from the project root):  docker compose -f monitoring/docker-compose.yml up -d --build
#   API        http://localhost:8000/docs
#   Prometheus http://localhost:9090
#   Grafana    http://localhost:3000  (dashboard "Heart Risk API")
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: heart-risk-api:1.0.0
    container_name: heart-risk-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      LOG_FILE: /tmp/logs/api.log
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: heart-risk-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.1.0
    container_name: heart-risk-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/heart-risk-api.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
